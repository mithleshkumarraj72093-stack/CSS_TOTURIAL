<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=
    , initial-scale=1.0"
    />
    <title>CSS Display properties</title>
    <style>
     #BOX1 {
        display:block;
        background-color: red;
        width: 100px;
        height: 100px;
        text-align: center;
        border-style: solid;
      }
      #BOX2 {
        display:block;
        background-color: red;
        width: 100px;
        height: 100px;
        text-align: center;
        border-style: solid;
      }


       #BOX3 {
        display:inline;
        background-color: red;
        width: 100px;
        height: 100px;
        text-align: center;
        border-style: solid;
      }
      #BOX4 {
        display:inline;
        background-color: red;
        width: 100px;
        height: 100px;
        text-align: center;
        border-style: solid;
      }

       #BOX5 {
        display:inline-block;
        background-color: red;
        width: 100px;
        height: 100px;
        text-align: center;
        border-style: solid;
      }
      #BOX6 {
        display:inline-block;
        background-color: red;
        width: 100px;
        height: 100px;
        text-align: center;
        border-style: solid;
      }

       #BOX7 {
        display:none;
        background-color: red;
        width: 100px;
        height: 100px;
        text-align: center;
        border-style: solid;
      }
      #BOX8 {
        display:none;
        background-color: red;
        width: 100px;
        height: 100px;
        text-align: center;
        border-style: solid;
      }


       #BOX9 {
        display:flex;
        background-color: red;
        width: 100px;
        height: 100px;
        text-align: center;
        border-style: solid;
      }
      #BOX10 {
        display:flex;
        background-color: red;
        width: 100px;
        height: 100px;
        text-align: center;
        border-style: solid;
      }
      






    </style>
  </head>
  <body>
    <h1>CSS Display properties</h1>
<!--  value BLOCK display-> Takes the full width available and starts on a new line. -->
    <div id="BOX1">BOX</div>
    <div id="BOX2">BOX</div>

   <!--   value INLINE ->  Takes only the required width and stays on the same line. Width and height do not work. -->

    <div id="BOX3">BOX</div>
    <div id="BOX4">BOX</div>
   
<!--  value inline-block Stays on the same line like inline, but you can set width and height. -->
     <div id="BOX5">BOX</div>
    <div id="BOX6">BOX </div>
  
<!--   value None- Hides the element completely. It doesn't take up any space. -->
     <div id="BOX7">BOX</div>
    <div id="BOX8">BOX</div>
   
<!--   value flex - Makes the element a flex container for easy alignment of child elements. -->

     <div id="BOX9">BOX</div>
    <div id="BOX10">BOX</div>
   
  </body>
</html>
